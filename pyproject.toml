[project]
name = "zenith-ai-backend"
version = "0.1.0"
description = "Backend API for the Zenith AI chatbot platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "drf-spectacular>=0.29,<0.30",
    "django-cors-headers>=4.9,<5.0",
    "python-dotenv>=1.2,<2.0",
    "google-genai>=1.70,<2.0",
    "openai>=2.21,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7.0",
    "dj-database-url>=2.3,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "pre-commit>=3.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"backend/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = 'migrations/'

[[tool.mypy.overrides]]
module = ["*.tests", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "backend.settings.development"
strict_settings = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["users", "chat", "health", "backend"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["users", "chat"]
omit = ["*/tests.py", "*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
