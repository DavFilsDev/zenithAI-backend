name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      LLM_API_KEY: ""
      DJANGO_SETTINGS_MODULE: backend.settings.test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run python manage.py spectacular --file /tmp/schema.yml --validate
