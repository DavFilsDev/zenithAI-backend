[project]
name = "zenith-ai-backend"
version = "0.1.0"
description = "Backend API for the Zenith AI chatbot platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "drf-spectacular>=0.29,<0.30",
    "django-cors-headers>=4.9,<5.0",
    "python-dotenv>=1.2,<2.0",
    "google-genai>=1.70,<2.0",
    "openai>=2.21,<3.0",
    "psycopg[binary]>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "pre-commit>=3.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
